---
# EXPERIMENTAL — not a supported production topology.
#
# TurboLog's product is the local CLI (watch/scan/history). These manifests exist for
# contributors exploring `cargo build --features server`. They will NOT work as-is:
#   - Image/registry URLs are placeholders
#   - Probes hit /health and /ready, which http.rs does not implement yet
#   - /metrics is not exposed over HTTP
# See docs/OPERATIONS.md and tasks/todo.md (CLI-first roadmap).
#
# TurboLog — Docker Compose for single-node local experiments with `serve`
#
# Usage (after you have a server-featured image and real models):
#   mkdir -p models && ./scripts/download_model.sh   # or mount your models
#   docker compose -f deploy/docker-compose.yml up --build
#
# Healthcheck below is DISABLED in spirit — /health does not exist yet.
# Replace with a real probe only after WS-style HTTP hardening lands.

services:
  turbolog:
    build:
      context: ..
      dockerfile: Dockerfile
    image: turbolog:local-experimental
    container_name: turbolog-experimental
    restart: unless-stopped
    profiles:
      - experimental-server

    ports:
      - "8087:8087"

    environment:
      TURBOLOG_PORT: "8087"
      TURBOLOG_BIND: "0.0.0.0"
      TURBOLOG_DATA_DIR: "/data"
      TURBOLOG_MODEL_DIR: "/models"
      TURBOLOG_EMBEDDERS: "2"
      # Documented in older drafts; not enforced by current http.rs
      TURBOLOG_MAX_INFLIGHT: "200"
      TURBOLOG_AUTH_TOKEN: "${TURBOLOG_AUTH_TOKEN:-}"

    volumes:
      - turbolog-data:/data
      - ./models:/models:ro

    # Do not enable until GET /health exists:
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:8087/health"]
    #   interval: 15s
    #   timeout: 5s
    #   retries: 3
    #   start_period: 30s

    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=64m

    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "768m"
        reservations:
          cpus: "0.5"
          memory: "512m"

volumes:
  turbolog-data:
    driver: local

---
# EXPERIMENTAL — ClusterIP for local/cluster experiments with `serve`.
# Do not scrape /metrics until that route exists (it does not today).
apiVersion: v1
kind: Service
metadata:
  name: turbolog
  namespace: turbolog
  labels:
    app.kubernetes.io/name: turbolog
    app.kubernetes.io/component: engine-experimental
  annotations: {}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: turbolog
  ports:
    - name: http
      port: 8087
      targetPort: http
      protocol: TCP

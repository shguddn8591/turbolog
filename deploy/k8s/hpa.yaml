---
# EXPERIMENTAL — retired from product capacity planning.
# Former “min 6 / max 50 for 1M req/s” targets are intentionally removed.
# Prefer not applying this file. If you need HPA for a single-node experiment later,
# start from min=1 / max=2 after /metrics and readiness exist.
#
# This file is kept as a stub so old links do not 404; it is not a supported config.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: turbolog
  namespace: turbolog
  labels:
    app.kubernetes.io/name: turbolog
    app.kubernetes.io/component: hpa-experimental
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: turbolog
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

---
# EXPERIMENTAL scaffolding — not supported production.
# TurboLog product = local CLI. These manifests assume a future `serve` with /health,/ready,/metrics
# that does NOT exist yet. Probes below will fail against the current binary.
# See docs/OPERATIONS.md and tasks/todo.md.
#
# TurboLog Deployment (single-node experiment only; do not treat replica counts as capacity planning)
#
# Design notes (if you insist on trying this locally):
#   - Stateful-lite in-memory index — do not round-robin the same stream across pods.
#   - WAL / .tvim on /data (emptyDir loses state on restart).
#   - Models via initContainer or PVC into /models.
#   - Memory rough guide: 2 embedders × ~90 MB + index/WAL ≈ 512–768 Mi.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: turbolog
  namespace: turbolog
  labels:
    app.kubernetes.io/name: turbolog
    app.kubernetes.io/version: "0.3.0-experimental"
    app.kubernetes.io/component: engine-experimental
  annotations:
    # /metrics is NOT implemented yet — leave scrape off until it is
    # prometheus.io/scrape: "true"
    # prometheus.io/port: "8087"
    # prometheus.io/path: "/metrics"
spec:
  # Keep tiny for experiments; former “min 6 for 1M” guidance is retired
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: turbolog
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Matches PDB (minAvailable: 4) to replace up to 2 concurrently
      maxUnavailable: 2
      maxSurge: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: turbolog
        app.kubernetes.io/version: "0.3.0-experimental"
      annotations: {}
    spec:
      # ────────────────────────────────────────────
      # initContainer: Download model files
      # ────────────────────────────────────────────
      # In production, replace the URL below with internal artifact storage (S3, GCS, Harbor).
      # Alternatively, a dedicated init image with pre-packaged models can be used:
      #   image: registry.example.com/turbolog-models:0.1.0
      #   command: ["cp", "-r", "/bundled-models/.", "/models/"]
      initContainers:
        - name: model-init
          image: curlimages/curl:8.7.1
          command:
            - sh
            - -c
            - |
              set -e
              echo "[model-init] Downloading model files..."
              # TODO: Replace with actual model storage URL
              # curl -fL "$MODEL_BASE_URL/model.onnx" -o /models/model.onnx
              # curl -fL "$MODEL_BASE_URL/tokenizer.json" -o /models/tokenizer.json
              echo "[model-init] Placeholder: models already present or mounted via PVC"
              ls /models/
          env:
            - name: MODEL_BASE_URL
              value: "https://artifacts.example.com/turbolog-models/v0.1.0"
          volumeMounts:
            - name: model-volume
              mountPath: /models
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

      # ────────────────────────────────────────────
      # Main container
      # ────────────────────────────────────────────
      containers:
        - name: turbolog
          # TODO: Replace with actual image registry path
          image: registry.example.com/turbolog:0.1.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8087
              protocol: TCP

          # Environment variables: Inject non-secret settings from ConfigMap
          envFrom:
            - configMapRef:
                name: turbolog-config
          env:
            # Authentication token is injected from Secret (if absent, operates in no-auth mode)
            - name: TURBOLOG_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: turbolog-secret
                  key: auth-token
                  optional: true  # Operates in no-auth mode if token is absent

          # ─ Resources ──────────────────────────────
          # Based on 2 embedders * ~90 MB ONNX session + Index/WAL/Heap = ~512 MB.
          # If TURBOLOG_EMBEDDERS is increased, scale limits.memory proportionally.
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "768Mi"

          # ─ Probes ────────────────────────────────
          # DISABLED: /health and /ready are not implemented in http.rs yet.
          # Applying these probes against the current binary will kill the pod.
          # Uncomment only after experimental server hardening lands (tasks/todo.md).
          #
          # startupProbe:
          #   httpGet:
          #     path: /health
          #     port: http
          #   failureThreshold: 6
          #   periodSeconds: 10
          #   timeoutSeconds: 5
          # livenessProbe:
          #   httpGet:
          #     path: /health
          #     port: http
          #   periodSeconds: 15
          #   timeoutSeconds: 5
          #   failureThreshold: 3
          # readinessProbe:
          #   httpGet:
          #     path: /ready
          #     port: http
          #   periodSeconds: 10
          #   timeoutSeconds: 5
          #   failureThreshold: 3


          # ─ Volume Mounts ─────────────────────────
          volumeMounts:
            - name: data-volume
              mountPath: /data
            - name: model-volume
              mountPath: /models
              readOnly: true
            # Temporary write area (to bypass readOnlyRootFilesystem=true)
            - name: tmp
              mountPath: /tmp

          # ─ Security Context ─────────────────────
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

          # Graceful SIGTERM → final swap_tick is NOT implemented yet.
          # preStop sleep is cosmetic only.
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]

      terminationGracePeriodSeconds: 30

      # ────────────────────────────────────────────
      # Volumes
      # ────────────────────────────────────────────
      volumes:
        # WAL + Index snapshot.
        # emptyDir: Node local, initialized upon pod restart.
        # If persistence is needed, replace the emptyDir block below with a PersistentVolumeClaim:
        #   persistentVolumeClaim:
        #     claimName: turbolog-data-<pod-name>  # Automatically created when using StatefulSet
        - name: data-volume
          emptyDir:
            medium: ""
            # sizeLimit: 20Gi  # Limit as needed
        # Model files (populated by initContainer)
        - name: model-volume
          emptyDir:
            medium: ""
            sizeLimit: 2Gi
        # Temporary write space (/tmp)
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi

      # No multi-AZ anti-affinity: replicas default to 1 and product scope is not HA.

      # Service account (Least privilege)
      serviceAccountName: turbolog
      automountServiceAccountToken: false

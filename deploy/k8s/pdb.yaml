---
# EXPERIMENTAL stub — with Deployment replicas: 1 this PDB is largely pointless.
# Former minAvailable: 4 assumed a 6-replica “1M” topology that is out of product scope.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: turbolog
  namespace: turbolog
  labels:
    app.kubernetes.io/name: turbolog
    app.kubernetes.io/component: pdb-experimental
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: turbolog
